name: dragonfly
services:
  dragonfly:
    container_name: dragonfly
    build:
      context: ./dragonfly
      args:
        - PASSWORD=$PASSWORD
      network: host
    # network_mode: host
    ports:
      - "3333:22"
      - "8545:8545"
    volumes:
      - ./workspace:/home/dragonfly/workspace
    environment:
      - TZ="Etc/UTC"
    tty: true
    restart: unless-stopped
